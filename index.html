<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="BLD Trainer - trening algorytmów blindcubing 3x3">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>BLD Trainer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Main Menu -->
        <div id="menu-screen" class="screen active">
            <button id="theme-toggle" class="theme-toggle" title="Zmień motyw">🌙</button>
            <h1>BLD Trainer <small style="font-size:0.4em;color:var(--text-secondary)">2026-07-30</small></h1>
            <div class="menu-buttons">
                <button id="btn-edges" class="btn btn-primary">Edges</button>
                <button id="btn-corners" class="btn btn-primary">Corners</button>
            </div>
            <div class="menu-buttons secondary">
                <button id="btn-import" class="btn btn-secondary">Import</button>
                <button id="btn-stats" class="btn btn-secondary">Stats</button>
            </div>
        </div>

        <!-- Buffer Choice -->
        <div id="buffer-screen" class="screen">
            <h2>Wybierz bufor</h2>
            <div id="buffer-list" class="button-list"></div>
            <button class="btn btn-back" data-back="menu-screen">←</button>
        </div>

        <!-- Subset Choice -->
        <div id="subset-screen" class="screen">
            <h2>Wybierz podzbiór</h2>
            <div class="subset-buttons">
                <button id="btn-all" class="btn btn-primary">All</button>
                <button id="btn-slow" class="btn btn-secondary">Slow</button>
                <button id="btn-unstable" class="btn btn-secondary">Unstable</button>
                <button id="btn-difficult" class="btn btn-secondary">Difficult</button>
            </div>
            <div id="subset-custom" class="subset-custom">
                <h3>Custom</h3>
                <div class="target-selectors">
                    <select id="target1-select"></select>
                    <select id="target2-select"></select>
                    <button id="btn-add-target" class="btn btn-small">+</button>
                    <button id="btn-remove-target" class="btn btn-small">−</button>
                </div>
                <div id="selected-cases" class="selected-cases"></div>
            </div>
            <button id="btn-start-game" class="btn btn-primary btn-large">Start</button>
            <button class="btn btn-back" data-back="buffer-screen">←</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <button id="btn-exit-game" class="btn btn-exit">×</button>
            <div class="game-top">
                <span id="game-progress">1/20</span>
                <span id="game-avg"></span>
            </div>
            <div class="game-main">
                <div id="game-case" class="game-case"></div>
                <div id="game-alg" class="game-alg"></div>
            </div>
            <div class="game-bottom">
                <span id="game-last-result"></span>
                <span id="game-next"></span>
            </div>
            <div id="game-tap-area" class="game-tap-area">
                <span class="tap-hint">Tap to start / stop</span>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <h2>Wyniki sesji</h2>
            <div id="session-summary" class="session-summary"></div>
            <div class="results-header">
                <span id="sort-case" class="sort-btn" data-sort="case">Case <span class="sort-arrow"></span></span>
                <span id="sort-time" class="sort-btn active" data-sort="time">Czas <span class="sort-arrow">↓</span></span>
            </div>
            <div id="results-list" class="results-list"></div>
            <div class="results-actions">
                <button id="btn-save-results" class="btn btn-primary">Zapisz</button>
                <button id="btn-discard-results" class="btn btn-secondary">Odrzuć</button>
            </div>
        </div>

        <!-- Stats Screen -->
        <div id="stats-screen" class="screen">
            <h2>Statystyki</h2>
            <div id="global-stats" class="global-stats"></div>
            <button class="btn btn-back" data-back="menu-screen">←</button>
        </div>

        <!-- Import Screen -->
        <div id="import-screen" class="screen">
            <h2>Import algorytmów</h2>
            <div class="import-options">
                <label class="file-input-label">
                    <input type="file" id="import-file" accept=".xlsx,.xls,.txt,.csv" hidden>
                    <span class="btn btn-primary">Wybierz plik</span>
                </label>
                <p id="import-status"></p>
            </div>
            <button class="btn btn-back" data-back="menu-screen">←</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/game.js"></script>
    <script src="js/import.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
